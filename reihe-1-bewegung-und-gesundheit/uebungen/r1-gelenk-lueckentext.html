  <p class="lead">Fülle die Lücken mit den Wörtern aus dem Wortspeicher. Groß- und Kleinschreibung ist egal.</p>
  <div class="uebung" data-typ="lueckentext">
<script type="application/json">
{
 "text": "<p>An einem Gelenk passt der gewölbte [[Gelenkkopf]] des einen Knochens in die [[Gelenkpfanne]] des anderen Knochens. Beide sind mit glattem [[Gelenkknorpel|Knorpel]] überzogen. Dazwischen liegt der [[Gelenkspalt]]. Er ist mit [[Gelenkschmiere]] gefüllt, damit die Knochen leicht gleiten.<\/p><p>Die [[Gelenkkapsel]] umschließt das Gelenk. Feste [[Bänder]] halten die Knochen zusammen. Werden sie beim Umknicken überdehnt, spricht man von einer [[Verstauchung]].<\/p>"
}
</script>
